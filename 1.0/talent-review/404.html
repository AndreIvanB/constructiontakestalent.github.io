<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Construction Takes Talent</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<style>
  :root {
    --concrete: #e7e8e6;
    --ink: #23272b;
    --ink-soft: rgba(35, 39, 43, 0.72);
    --accent: #2596be;
    --accent-ink: #14607d;
    --hairline: rgba(35, 39, 43, 0.16);
    --display: "Arial Black", "Segoe UI Black", "Helvetica Neue", system-ui, sans-serif;
    --body: "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "Segoe UI Mono", Consolas, "SF Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--concrete); color-scheme: only light; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: clamp(1.5rem, 6vw, 4rem);
    font-family: var(--body);
    color: var(--ink);
    line-height: 1.6;
  }
  main { max-width: 46ch; display: flex; flex-direction: column; gap: 1.4rem; }
  .mark { width: 46px; height: 46px; display: block; }
  .eyebrow {
    margin: 0;
    font-family: var(--mono);
    font-size: 0.66rem;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--accent-ink);
  }
  h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(1.7rem, 6vw, 2.6rem);
    line-height: 1.02;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    text-wrap: balance;
  }
  p { margin: 0; color: var(--ink-soft); text-wrap: pretty; }
  .tick {
    height: 11px;
    border-top: 1px solid rgba(37, 150, 190, 0.38);
    background-image:
      linear-gradient(rgba(37,150,190,.38), rgba(37,150,190,.38)),
      repeating-linear-gradient(to right, rgba(37,150,190,.38) 0 1px, transparent 1px 11px);
    background-size: 1px 5px, 100% 5px;
    background-position: top right, top left;
    background-repeat: no-repeat, no-repeat;
    width: 132px;
  }
  a.btn {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 0.7rem;
    padding: 0.9rem 1.5rem;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: var(--concrete);
    font-family: var(--mono);
    font-size: 0.74rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    text-decoration: none;
    transition: background 180ms ease, border-color 180ms ease, transform 180ms ease;
  }
  a.btn:hover, a.btn:focus-visible {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    transform: translateY(-1px);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; } }
</style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 48 48" role="img" aria-label="Construction Takes Talent">
      <path d="M38.78 41.62 A23 23 0 1 1 38.78 6.38 L34.61 11.36 A16.5 16.5 0 1 0 34.61 36.64 Z" fill="#23272b"/>
      <rect x="11" y="16" width="12" height="5" fill="#2596be"/>
      <rect x="14.5" y="21" width="5" height="12" fill="#2596be"/>
      <rect x="26" y="16" width="11" height="5" fill="#2596be"/>
      <rect x="29" y="21" width="5" height="9" fill="#2596be"/>
    </svg>

    <div>
      <p class="eyebrow">Error 404</p>
      <div class="tick" aria-hidden="true"></div>
    </div>

    <h1>This page isn&rsquo;t here.</h1>

    <p>
      The link may be old, or a role may have closed. The open positions are all on
      the main page &mdash; and if you were looking for something specific, ask us
      directly.
    </p>

    <a class="btn" href="#" id="home">
      Back to open roles
      <span aria-hidden="true">&rarr;</span>
    </a>
  </main>
<script>
  /* Project Pages live under /<repo>/ — rebuild that base from the URL
     so this button works without hardcoding the repo name. */
  var seg = location.pathname.split("/").filter(Boolean);
  document.getElementById("home").href =
    location.hostname.endsWith("github.io") && seg.length ? "/" + seg[0] + "/" : "/";
</script>
</body>
</html>
